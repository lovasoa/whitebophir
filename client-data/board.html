<!DOCTYPE html>
<html lang="{{language}}" dir="ltr" data-wbo-version="{{appVersion}}" data-ui-direction="{{direction}}"{{#moderator}} data-moderator="true"{{/moderator}}>

<head>
	<meta charset="utf-8" />
	<title>{{board}} | WBO | {{translations.collaborative_whiteboard}}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="{{assetBase}}icons.css" />
	<link rel="stylesheet" type="text/css" href="{{assetBase}}board.css" />
	<link rel="modulepreload" href="{{assetBase}}js/board_boot.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_bootstrap.js" />
	<link rel="modulepreload" href="{{assetBase}}js/app_tools_core.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_dom_bootstrap.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_message_replay.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_name.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_page_state.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_preferences.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_runtime_core.js" />
	<link rel="modulepreload" href="{{assetBase}}js/board_viewport.js" />
	<link rel="modulepreload" href="{{assetBase}}js/frontend_logging.js" />
	<link rel="modulepreload" href="{{assetBase}}js/performance_metrics.js" />
	<link rel="modulepreload" href="{{assetBase}}js/message_limits.js" />
	<script id="socketio-client" async src="../socket.io/socket.io.js"></script>
	<meta name="description" content="{{translations.tagline}}" />
	<meta name="keywords"
		content="{{translations.collaborative_whiteboard}},online,draw,paint,shared,realtime,wbo,whitebophir" />
	<link rel="apple-touch-icon" href="{{assetBase}}favicon.svg">
	<link rel="icon" type="image/x-icon" sizes="16x16" href="{{assetBase}}favicon.ico">
	<link rel="manifest" href="../manifest.json" />
	<meta property="og:title" content="{{board}} | WBO | {{translations.collaborative_whiteboard}}" />
	<meta property="og:url" content="{{baseUrl}}/boards/{{boardUriComponent}}" />
	<meta property="og:image" content="{{baseUrl}}/preview/{{boardUriComponent}}" />
	<link rel="canonical" href="{{canonicalUrl}}" />
	{{#languageLinks}}
	<link rel="alternate" hreflang="{{language}}" href="{{href}}" />
	{{/languageLinks}}
	{{{htmlHeadSnippet}}}
</head>

<body>
	<div id="boardHud" class="board-hud" dir="{{direction}}">
		<div class="board-presence">
			<button id="connectedUsersToggle" class="board-presence-toggle" type="button"
				aria-controls="connectedUsersPanel" aria-expanded="false">
				<svg class="board-presence-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
					<use href="{{assetBase}}users.svg#icon"></use>
				</svg>
				<span class="tool-name" hidden></span>
			</button>
			<div id="connectedUsersPanel" class="connected-users-panel connected-users-panel-hidden"
				role="region" aria-label="{{translations.users}}">
				<ul id="connectedUsersList" class="connected-users-list"></ul>
				<details id="activeBansSection" class="active-bans-section" hidden>
					<summary id="activeBansSummary"></summary>
					<ul id="activeBansList" class="active-bans-list"></ul>
				</details>
				<div class="connected-users-footer">
					<a id="rulesSafetyLink" class="board-rules-link" href="../rules?lang={{language}}"
						target="_blank" rel="noopener">
					</a>
				</div>
			</div>
		</div>
		<section id="boardNotice" class="board-notice" dir="{{direction}}"
			aria-labelledby="boardNoticeTitle" hidden>
			<h2 id="boardNoticeTitle"></h2>
			<div id="boardNoticeBody"></div>
			<a id="boardNoticePrimaryAction" class="board-notice-primary" hidden></a>
			<div class="board-notice-actions">
				<a id="boardNoticeRules" href="../rules?lang={{language}}" target="_blank" rel="noopener"></a>
				<span aria-hidden="true">·</span>
				<button id="boardNoticeDismiss" type="button"></button>
			</div>
		</section>
		<div id="boardStatusIndicator" class="board-status-card board-status-reconnecting" role="status"
			aria-live="polite" data-state="reconnecting">
			<span class="board-status-icon" aria-hidden="true"></span>
			<div class="board-status-copy">
				<div id="boardStatusTitle" class="board-status-title">{{translations.loading}}</div>
				<div id="boardStatusNotice" class="board-status-detail board-status-detail-hidden"></div>
			</div>
		</div>
	</div>

	<div id="menu" tabindex="0" {{#hideMenu}}style="display:none;"{{/hideMenu}}>
		<div id="menuItems">
			<div id="tools" class="tools">
				{{#tools}}
				<button type="button" class="tool disabledTool" tabindex="-1" id="toolID-{{id}}" data-tool-id="{{id}}" aria-label="{{label}}" {{^visible}}hidden{{/visible}}
					aria-disabled="true">
					<svg class="tool-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
						<use {{#visible}}href{{/visible}}{{^visible}}data-icon-url{{/visible}}="{{iconUrl}}#icon"></use>
					</svg>
					<span class="tool-name">{{label}}</span>
					<svg class="tool-icon secondaryIcon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use></use></svg>
				</button>
				{{/tools}}
			</div>

			<ul class="tools" id="settings">
				<li class="style-tool-menu" id="styleToolMenu">
					<details class="tool" id="styleTool">
						<summary id="styleSummary" aria-controls="stylePanel">
							<span class="tool-icon" id="stylePreview" aria-hidden="true">
								<svg viewBox="0 0 32 32" focusable="false">
									<circle id="stylePreviewDotOutline" cx="16" cy="16" r="7.35" fill="none"
										stroke="currentColor" stroke-width="1.25"></circle>
									<circle id="stylePreviewDot" cx="16" cy="16" r="6" fill="currentColor"
										fill-opacity="1"></circle>
								</svg>
							</span>
						</summary>
					</details>
					<fieldset class="style-panel" id="stylePanel">
						<legend class="style-panel-title">{{translations.color}}</legend>
						<input type="color" id="chooseColor" class="style-hidden-input" value="#1913B0"
							tabindex="-1" aria-label="{{translations.color}}" />
						<div class="colorPresets" id="colorPresetSel" role="group"
							aria-label="{{translations.color}}">
							<button type="button" class="colorPresetButton"></button>
						</div>
						<div class="style-row">
							<label class="style-row-label" for="chooseSize">
								<span class="style-row-name">{{translations.size}}</span>
								<span class="style-row-shortcuts">
									<kbd class="tool-shortcut">[</kbd><kbd class="tool-shortcut">]</kbd>
									<span class="style-row-hint">S + {{translations.mousewheel}}</span>
								</span>
							</label>
							<input type="range" id="chooseSize" value="40" min="10" max="500" step="10"
								class="rangeChooser" />
						</div>
						<div class="style-row">
							<label class="style-row-label" for="chooseOpacity">
								<span class="style-row-name">{{translations.opacity}}</span>
								<span class="style-row-shortcuts">
									<kbd class="tool-shortcut">,</kbd><kbd class="tool-shortcut">.</kbd>
									<span class="style-row-hint">O + {{translations.mousewheel}}</span>
								</span>
							</label>
							<input type="range" id="chooseOpacity" value="1" min="0.1" max="1" step="0.05"
								class="rangeChooser" />
						</div>
					</fieldset>
				</li>
				</ul>
			</div>
		</div>

	<script type="application/json" id="translations">{{{ json translations }}}</script>
	<script type="application/json" id="configuration">{{{ json configuration }}}</script>
	<script type="application/json" id="board-state">{{{ json boardState }}}</script>
	<script type="module" async src="../js/board_main.js"></script>

	<div id="board">
		{{{inlineBoardSvg}}}
	</div>
</body>

</html>
