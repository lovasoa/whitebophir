name: Node.js CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          check-latest: true
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run benchmark
        timeout-minutes: 4
        run: npm run bench
      - run: npm test
        env:
          CI: true
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-output-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag wbo-test .
      - name: Serve a board from the production container
        run: |
          docker run --detach --name wbo-test --publish 127.0.0.1:5001:80 wbo-test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 http://127.0.0.1:5001/boards/ci > /tmp/board.html
          grep -q '<svg id="canvas"' /tmp/board.html
      - name: Container logs
        if: always()
        run: docker logs wbo-test
      - run: docker build --pull --file .devcontainer/Dockerfile --tag wbo-dev-test .
      - run: docker run --rm wbo-dev-test node --version
