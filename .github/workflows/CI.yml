name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # GITHUB_TOKEN merges do not trigger push workflows.
  workflow_dispatch:

permissions:
  contents: read

# Keep master tests and publication in order without dropping queued pushes.
concurrency:
  group: ci-${{ github.ref }}
  queue: max

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "npm"

      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run benchmark
        timeout-minutes: 4
        run: npm run bench
      - run: npm test
        env:
          CI: true
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-output-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/

  release:
    needs: [typecheck, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.repository == 'lovasoa/whitebophir'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
