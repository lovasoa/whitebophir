name: deploy
on:
  workflow_run:
    workflows: [Node.js CI]
    types: [completed]
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-tag:
    if: github.event_name == 'push'
    uses: ./.github/workflows/CI.yml

  prepare:
    needs: validate-tag
    if: >-
      !cancelled() &&
      (needs.validate-tag.result == 'success' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'master' &&
         (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Prepare release version
        id: version
        env:
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            sh bin/prepare-release "$TESTED_COMMIT"
          else
            sh bin/ci-pre-deploy
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --generate-notes

  build:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' }}
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Dokku
        uses: dokku/github-action@v1.10.0
        with:
          ci_commit: ${{ needs.prepare.outputs.commit }}
          ci_branch_name: ${{ needs.prepare.outputs.tag }}
          git_remote_url: ssh://dokku@${{ secrets.SSH_SERVER }}:22/wbo
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          git_push_flags: --force
          trace: 1
          branch: main
  push_to_registry:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' }}
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: lovasoa
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: lovasoa/wbo:latest,lovasoa/wbo:${{ needs.prepare.outputs.tag }}
          platforms: linux/amd64,linux/arm64
